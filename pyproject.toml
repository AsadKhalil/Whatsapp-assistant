[project]
name = "whatsapp-assistant"
version = "0.1.0"
description = "WhatsApp AI assistant engine for businesses (official Cloud API + WAHA groups)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "openai>=3.19",
  "gspread>=6.1",
  "pyyaml>=6.0",
  "tzdata>=2024.1",
  "jinja2>=3.1",
  "cryptography>=44",
  "qrcode>=8.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # explicit, so a new ruff release can't change what the lint step checks

[tool.uv]
package = false
